<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering Flap T/D | Kira's English</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        
        .action-card { background: #000; border-left: 8px solid #D30000; border-radius: 12px; padding: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); width: 95%; max-width: 900px; box-sizing: border-box; }
        
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        
        .header-title-container { display: flex; align-items: center; gap: 15px; border-bottom: 3px solid #D30000; padding-bottom: 12px; }
        .header-title-container span { color: #ffffff; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; }
        
        .logo-bracket { width: 50px; height: 50px; background: #000; border-left: 4px solid #D30000; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding-left: 6px; }
        .logo-bracket img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        
        .header-right { display: flex; align-items: center; gap: 20px; padding-bottom: 12px; white-space: nowrap; }
        #counter { font-size: 1.1rem; font-weight: 700; color: #D30000; }
        
        .progress-container { width: 100%; background: #222; height: 10px; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        .progress-bar { height: 100%; background: #D30000; width: 0%; transition: width 0.4s ease; }
        
        .exercise-block { background: #111; padding: 40px 30px; border-radius: 15px; border: 1px solid #222; text-align: center; }
        
        .target-text, .ipa-text { font-size: 2.5rem; font-weight: 700; display: block; margin-bottom: 8px; line-height: 1.1; }
        .target-text { color: #ffffff; }
        .ipa-text { color: #D30000; }

        .translation-text { font-size: 1.3rem; color: #666; font-style: italic; margin: 15px auto 25px auto; min-height: 28px; cursor: pointer; transition: 0.3s; display: inline-block; }
        .translation-text:hover { color: #fff; }
        .blur { filter: blur(5px); opacity: 0.6; }
        
        button { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Montserrat', sans-serif; font-size: 1.1rem; margin: 10px auto; border: none; transition: 0.2s; display: block; }
        
        .btn-listen { background: #252525; color: white; border: 1px solid #444; }
        .btn-listen:hover { background: #333; }
        .btn-speak { background: #D30000; color: white; position: relative; box-shadow: 0 4px 15px rgba(211, 0, 0, 0.3); }
        .btn-next { background: #00FF00; color: #000; margin-top: 15px; }
        .btn-skip { background: transparent; color: #555; border: 1px solid #222; font-size: 0.8rem; }
        
        #feedback { margin-top: 20px; min-height: 50px; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; justify-content: center; text-align: center; color: #ffffff; }
        
        .success { color: #00FF00 !important; }
        .error { color: #D30000 !important; }
        .hidden { display: none; }
        
        @media (max-width: 600px) { 
            .action-card { padding: 20px; }
            .exercise-block { padding: 30px 15px; }
            .target-text, .ipa-text { font-size: 2rem; } 
            .logo-bracket { width: 35px; height: 35px; } 
            .logo-bracket img { width: 30px; height: 30px; } 
            .header-title-container span { font-size: 0.9rem; }
            .header-right { gap: 10px; }
            #counter { font-size: 0.85rem; }
            .translation-text { font-size: 1.1rem; }
        }
        
        @keyframes pulse-red { 0% { box-shadow: 0 0 0px 0px rgba(211, 0, 0, 0.7); } 70% { box-shadow: 0 0 0px 20px rgba(211, 0, 0, 0); } 100% { box-shadow: 0 0 0px 0px rgba(211, 0, 0, 0); } }
        .listening-active { animation: pulse-red 1.5s infinite; background-color: #ff0000 !important; }
    </style>
</head>
<body>

<div class="action-card">
    <div class="section-header">
        <div class="header-title-container">
            <div class="logo-bracket"><img src="https://drive.google.com/thumbnail?id=1DQWHMZf7MpnzZBa3CbqqyJGLQEK6U4lZ" alt="Kira"></div>
            <span>Vowel Sounds + Flap T/D</span>
        </div>
        <div class="header-right">
            <span id="counter">1 / 65</span>
        </div>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-area">
        <div class="exercise-block" id="block">
            <span class="target-text" id="txt"></span>
            <span class="ipa-text" id="ipa"></span>
            
            <div>
                <div id="translation" class="translation-text blur" onclick="toggleBlur()"></div>
            </div>
            
            <button class="btn-listen" onclick="play()">1. Escuchar Audio 🔊</button>
            <button class="btn-speak" id="mic" onclick="start()">2. Presiona y Habla: 🎤</button>
            
            <div id="feedback">Listo para empezar.</div>

            <button id="next" class="btn-next hidden" onclick="go()">Siguiente Palabra ➔</button>
            <button id="skip" class="btn-skip" onclick="go()">Saltar palabra</button>
        </div>
    </div>
</div>

<script>
    let data = [
        // 1. /i:/
        { t: "Meeting", p: "/ˈmiːtɪn/", s: "Reunión" }, { t: "Greeting", p: "/ˈɡriːtɪn/", s: "Saludo" }, { t: "Sweeter", p: "/ˈswiːtər/", s: "Más dulce" },
        { t: "Cheating", p: "/ˈtshiːtɪn/", s: "Engañar / Hacer trampa" }, { t: "Beater", p: "/ˈbiːtər/", s: "Batidor" }, { t: "Heating", p: "/ˈhiːtɪn/", s: "Calefacción" },
        // 2. /ɪ/
        { t: "City", p: "/ˈsɪti/", s: "Ciudad" }, { t: "Pity", p: "/ˈpɪti/", s: "Lástima" }, { t: "Fitting", p: "/ˈfɪtɪn/", s: "Ajuste / Prueba de ropa" },
        { t: "Sitting", p: "/ˈsɪtɪn/", s: "Sentado" }, { t: "Kitty", p: "/ˈkɪti/", s: "Gatito" }, { t: "Witty", p: "/ˈwɪti/", s: "Ingenioso" },
        // 3. /e/
        { t: "Better", p: "/ˈbetər/", s: "Mejor" }, { t: "Letter", p: "/ˈletər/", s: "Carta" }, { t: "Setting", p: "/ˈsetɪn/", s: "Ajuste / Escenario" },
        { t: "Getting", p: "/ˈɡetɪn/", s: "Obteniendo / Llegando" }, { t: "Petty", p: "/ˈpeti/", s: "Insignificante" }, { t: "Met it", p: "/ˈmetɪt/", s: "Lo encontré" },
        // 4. /æ/
        { t: "Matter", p: "/ˈmætər/", s: "Asunto / Importar" }, { t: "Saturday", p: "/ˈsætərdeɪ/", s: "Sábado" },
        { t: "Chatty", p: "/ˈtshæti/", s: "Platicador" }, { t: "Pattern", p: "/ˈpætərn/", s: "Patrón" }, { t: "At all", p: "/æt ˈɔːl/", s: "Para nada" },
        // 5. /ʌ/
        { t: "Butter", p: "/ˈbʌtər/", s: "Mantequilla" }, { t: "Cutter", p: "/ˈkʌtər/", s: "Cortador" }, { t: "Shut it", p: "/ˈshʌtɪt/", s: "Ciérralo" },
        { t: "Mutter", p: "/ˈmʌtər/", s: "Refunfuñar" }, { t: "Gutter", p: "/ˈɡʌtər/", s: "Alcantarilla" },
        // 6. /ɑː/
        { t: "Water", p: "/ˈwɔːtər/", s: "Agua" }, { t: "Potty", p: "/ˈpɑːti/", s: "Bacinica" }, { t: "Lot of", p: "/ˈlɑːt əv/", s: "Mucho de" },
        { t: "Got it", p: "/ˈɡɑːtɪt/", s: "Lo tengo / Entendido" }, { t: "Spotted", p: "/ˈspɑːtəd/", s: "Manchado / Avistado" }, { t: "Body", p: "/ˈbɑːdi/", s: "Cuerpo" },
        // 7. /ɔː/
        { t: "Daughter", p: "/ˈdɔːtər/", s: "Hija" }, { t: "Quarter", p: "/ˈkwɔːtər/", s: "Cuarto / Trimestre" }, { t: "Shorten", p: "/ˈshɔːrtən/", s: "Acortar" },
        { t: "Sorted", p: "/ˈsɔːrtəd/", s: "Clasificado" }, { t: "Forty", p: "/ˈfɔːrti/", s: "Cuarenta" }, { t: "Watery", p: "/ˈwɔːtəri/", s: "Acuoso" },
        // 8. /ʊ/
        { t: "Put it", p: "/ˈpʊtɪt/", s: "Ponlo" }, { t: "Pudding", p: "/ˈpʊdɪn/", s: "Pudín" },
        { t: "Good at", p: "/ˈɡʊdæt/", s: "Bueno en" }, { t: "Wooden", p: "/ˈwʊdən/", s: "De madera" }, { t: "Should I", p: "/ˈshʊd aɪ/", s: "¿Debería yo?" },
        // 9. /u:/
        { t: "Shooting", p: "/ˈshuːtɪn/", s: "Disparando" },
        { t: "Scooter", p: "/ˈskuːtər/", s: "Motoneta" }, { t: "Suitor", p: "/ˈsuːtər/", s: "Pretendiente" }, { t: "Rooting", p: "/ˈruːtɪn/", s: "Apoyar / Echar porras" },
        // 10. /ɜːr/
        { t: "Dirty", p: "/ˈdɜːrti/", s: "Sucio" }, { t: "Flirty", p: "/ˈflɜːrti/", s: "Coqueto" }, { t: "Shirt it", p: "/ˈshɜːrtɪt/", s: "Camisa (verbo coloq.)" },
        { t: "Alerted", p: "/əˈlɜːrtəd/", s: "Alertado" }, { t: "Stir it", p: "/ˈstɜːrtɪt/", s: "Agítalo / Revuélvelo" },
        // 11. /ə/
        { t: "Data", p: "/ˈdeɪtə/", s: "Datos" }, { t: "Soda", p: "/ˈsoʊtə/", s: "Refresco" }, { t: "Item", p: "/ˈaɪtəm/", s: "Artículo / Objeto" },
        { t: "Atom", p: "/ˈætəm/", s: "Átomo" }, { t: "Bottom", p: "/ˈbɑːtəm/", s: "Fondo / Parte inferior" }, { t: "Waiting", p: "/ˈweɪtɪn/", s: "Esperando" },
        // 12. /oʊ/
        { t: "Total", p: "/ˈtoʊtəl/", s: "Total" }, { t: "Noted", p: "/ˈnoʊtəd/", s: "Anotado" }, { t: "Floated", p: "/ˈfloʊtəd/", s: "Flotó" },
        { t: "Voted", p: "/ˈvoʊtəd/", s: "Votó" }, { t: "Motor", p: "/ˈmoʊtər/", s: "Motor" }
    ];

    data = data.sort(() => Math.random() - 0.5);

    let idx = 0;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = Recognition ? new Recognition() : null;
    if(rec) { rec.lang = 'en-US'; rec.continuous = false; }

    function toggleBlur() { document.getElementById('translation').classList.toggle('blur'); }

    function play() {
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance(data[idx].t);
        u.lang = 'en-US';
        u.rate = 0.75;
        window.speechSynthesis.speak(u);
    }

    function start() {
        if (!rec) return alert("Micro no compatible.");
        try { rec.start(); } catch(e) {}
        document.getElementById('mic').classList.add('listening-active');
        document.getElementById('mic').innerText = "Escuchando... 🎤";
    }

    if(rec) {
        rec.onresult = (e) => {
            let heard = e.results[0][0].transcript.toLowerCase().replace(/[.,!?]/g,"").trim();
            let target = data[idx].t.toLowerCase().replace(/[.,!?]/g,"").trim();
            const fb = document.getElementById('feedback');

            if (heard.includes(target) || target.includes(heard)) {
                fb.innerHTML = `<span class="success">¡Muy bien! Escuché "${target}" ✅</span>`;
                document.getElementById('next').classList.remove('hidden');
                document.getElementById('skip').classList.add('hidden');
            } else {
                fb.innerHTML = `<span class="error">Escuché: "${heard}"... ❌</span>`;
            }
        };

        rec.onend = () => {
            document.getElementById('mic').classList.remove('listening-active');
            document.getElementById('mic').innerText = "2. Presiona y Habla: 🎤";
        };
    }

    function updateCard() {
        document.getElementById('txt').innerText = data[idx].t;
        document.getElementById('ipa').innerText = data[idx].p;
        document.getElementById('translation').innerText = data[idx].s;
        document.getElementById('translation').classList.add('blur');
        document.getElementById('counter').innerText = `${idx + 1} / ${data.length}`;
        document.getElementById('progress-bar').style.width = `${((idx + 1) / data.length) * 100}%`;
    }

    function go() {
        idx++;
        if (idx < data.length) {
            updateCard();
            document.getElementById('next').classList.add('hidden');
            document.getElementById('skip').classList.remove('hidden');
            document.getElementById('feedback').innerHTML = "Listo.";
        } else {
            document.getElementById('quiz-area').innerHTML = `<div class="exercise-block"><h2 style="color:#00FF00">¡MAESTRÍA TOTAL!</h2><button class="btn-speak" onclick="location.reload()">REINICIAR</button></div>`;
        }
    }

    updateCard();
</script>
</body>
</html>
